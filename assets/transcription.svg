<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Jianpu to jianzipu transcription pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f6f1e7}
    .t{font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#2b2118}
    .h{font-size:14.5px;font-weight:600}
    .s{font-size:11px;fill:#6b5d4f}
    .cap{font-size:11px;letter-spacing:.12em;fill:#9a8b7a;font-weight:600}
    .tag{font-size:10.5px;font-weight:700;fill:#fff}
    .stage{fill:#fffdf8;stroke:#d9cdb8;stroke-width:1.2}
    .arrow{stroke:#c9bba5;stroke-width:1.4;fill:none;marker-end:url(#a)}
    .num{font-family:"Times New Roman",serif;font-size:26px;font-weight:700;fill:#2b2118}
    .node{fill:#efe7d8;stroke:#cdbfa8}
    .edge{stroke:#d6cab6;stroke-width:1}
    .best{stroke:#b5402f;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:draw 5s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:520}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
    .hit{fill:#b5402f;opacity:0;animation:hit 5s ease-in-out infinite}
    .hit.h2{animation-delay:.55s}.hit.h3{animation-delay:1.1s}.hit.h4{animation-delay:1.65s}
    @keyframes hit{0%,8%{opacity:0}18%,80%{opacity:1}100%{opacity:0}}
    .scan{fill:#b5402f;opacity:.12;animation:scan 5s ease-in-out infinite}
    @keyframes scan{0%{transform:translateX(0)}45%{transform:translateX(330px)}46%,100%{transform:translateX(330px);opacity:0}}
    .glyph{opacity:0;animation:show 5s ease-in-out infinite}
    .glyph.g2{animation-delay:.25s}.glyph.g3{animation-delay:.5s}.glyph.g4{animation-delay:.75s}
    @keyframes show{0%,46%{opacity:0;transform:translateY(6px)}58%,88%{opacity:1;transform:none}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.best{animation:none;stroke-dashoffset:0}.hit,.glyph{animation:none;opacity:1}.scan{animation:none;opacity:0}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c9bba5"/></marker></defs>
  <rect class="bg" width="960" height="440" rx="18"/>
  <text class="t cap" x="36" y="40">简谱 → 减字谱：不是查表，是演奏路径规划 · JIANPU → JIANZIPU AS PATH PLANNING</text>

  <!-- input -->
  <rect class="stage" x="36" y="62" width="150" height="250" rx="12"/>
  <text class="t h" x="52" y="88">输入 Input</text>
  <text class="t s" x="52" y="106">简谱文本 / MusicXML</text>
  <text class="num" x="62"  y="160">5</text><text class="num" x="96" y="160">3</text><text class="num" x="130" y="160">2</text>
  <text class="num" x="62"  y="205">1</text><text class="num" x="96" y="205">2</text><text class="num" x="130" y="205">3</text>
  <text class="t s" x="52" y="248">和声 · 连线 · 滑音记号</text>
  <text class="t s" x="52" y="266">一并带入转译</text>
  <path class="arrow" d="M190 187 H226"/>

  <!-- lattice -->
  <rect class="stage" x="230" y="62" width="420" height="250" rx="12"/>
  <text class="t h" x="248" y="88">候选图 + Beam Search</text>
  <text class="t s" x="248" y="106">每个音枚举 散 / 按 / 泛 × 弦 × 徽分，按整段路径求最小代价</text>
  <rect class="scan" x="262" y="118" width="70" height="182" rx="8"/>
  <g>
    <!-- columns x: 296, 406, 516, 616 ; rows y: 140, 180, 220, 260 -->
    <g class="edge">
      <line x1="296" y1="140" x2="406" y2="180"/><line x1="296" y1="180" x2="406" y2="180"/><line x1="296" y1="220" x2="406" y2="140"/><line x1="296" y1="260" x2="406" y2="220"/><line x1="296" y1="180" x2="406" y2="260"/>
      <line x1="406" y1="140" x2="516" y2="180"/><line x1="406" y1="180" x2="516" y2="220"/><line x1="406" y1="220" x2="516" y2="180"/><line x1="406" y1="260" x2="516" y2="260"/><line x1="406" y1="180" x2="516" y2="140"/>
      <line x1="516" y1="140" x2="616" y2="180"/><line x1="516" y1="220" x2="616" y2="220"/><line x1="516" y1="180" x2="616" y2="140"/><line x1="516" y1="260" x2="616" y2="260"/><line x1="516" y1="220" x2="616" y2="180"/>
    </g>
    <g class="node">
      <circle cx="296" cy="140" r="9"/><circle cx="296" cy="180" r="9"/><circle cx="296" cy="220" r="9"/><circle cx="296" cy="260" r="9"/>
      <circle cx="406" cy="140" r="9"/><circle cx="406" cy="180" r="9"/><circle cx="406" cy="220" r="9"/><circle cx="406" cy="260" r="9"/>
      <circle cx="516" cy="140" r="9"/><circle cx="516" cy="180" r="9"/><circle cx="516" cy="220" r="9"/><circle cx="516" cy="260" r="9"/>
      <circle cx="616" cy="140" r="9"/><circle cx="616" cy="180" r="9"/><circle cx="616" cy="220" r="9"/><circle cx="616" cy="260" r="9"/>
    </g>
    <path class="best" d="M296 180 L406 180 L516 220 L616 220"/>
    <circle class="hit"    cx="296" cy="180" r="9"/><circle class="hit h2" cx="406" cy="180" r="9"/>
    <circle class="hit h3" cx="516" cy="220" r="9"/><circle class="hit h4" cx="616" cy="220" r="9"/>
  </g>
  <text class="t s" x="276" y="296">5</text><text class="t s" x="386" y="296">3</text><text class="t s" x="496" y="296">2</text><text class="t s" x="596" y="296">1</text>
  <path class="arrow" d="M654 187 H690"/>

  <!-- output -->
  <rect class="stage" x="694" y="62" width="230" height="250" rx="12"/>
  <text class="t h" x="712" y="88">输出 Output</text>
  <text class="t s" x="712" y="106">减字 + 五线谱同步落笔</text>
  <g class="t" style="font-size:13px">
    <g class="glyph"><rect x="712" y="124" width="196" height="34" rx="7" fill="#efe7d8"/><text x="724" y="146">3 → 五弦 · 七徽 · 大指 · 挑</text></g>
    <g class="glyph g2"><rect x="712" y="164" width="196" height="34" rx="7" fill="#efe7d8"/><text x="724" y="186">按音之间少换弦、多走手</text></g>
    <g class="glyph g3"><rect x="712" y="204" width="196" height="34" rx="7" fill="#efe7d8"/><text x="724" y="226">2-3-2 → 折叠为「进复」</text></g>
    <g class="glyph g4"><rect x="712" y="244" width="196" height="34" rx="7" fill="#efe7d8"/><text x="724" y="266">可替换候选，一键改选</text></g>
  </g>

  <!-- three layers -->
  <g>
    <rect x="36"  y="334" width="284" height="74" rx="10" fill="#fffdf8" stroke="#d9cdb8"/>
    <rect x="52" y="350" width="26" height="20" rx="4" fill="#2b2118"/><text class="t tag" x="58" y="364">信</text>
    <text class="t h" x="88" y="365">音高与谱字正确</text>
    <text class="t s" x="52" y="392">只在合法候选上排序，不生成不可校验的减字</text>

    <rect x="338" y="334" width="284" height="74" rx="10" fill="#fffdf8" stroke="#d9cdb8"/>
    <rect x="354" y="350" width="26" height="20" rx="4" fill="#3f7d5a"/><text class="t tag" x="360" y="364">达</text>
    <text class="t h" x="390" y="365">演奏动作顺手</text>
    <text class="t s" x="354" y="392">弦距 · 徽距 · 左手用指连续性 · 排序模型重排</text>

    <rect x="640" y="334" width="284" height="74" rx="10" fill="#fffdf8" stroke="#d9cdb8"/>
    <rect x="656" y="350" width="26" height="20" rx="4" fill="#b5402f"/><text class="t tag" x="662" y="364">雅</text>
    <text class="t h" x="692" y="365">风格与曲意</text>
    <text class="t s" x="656" y="392">进复 · 退复 · 往来 · 吟；源谱没标的不替人加花</text>
  </g>
</svg>
