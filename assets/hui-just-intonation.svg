<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Thirteen hui positions in just intonation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f6f1e7}
    .t{font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#2b2118}
    .cap{font-size:11px;letter-spacing:.12em;fill:#9a8b7a;font-weight:600}
    .lab{font-size:11px;font-weight:600}
    .frac{font-size:10.5px;fill:#8a7a68;font-family:ui-monospace,Menlo,monospace}
    .s{font-size:11.5px;fill:#6b5d4f}
    .board{fill:#3d2e1e}
    .str{stroke:#e9dcc4;stroke-width:1.6;fill:none}
    .vib{stroke:#b5402f;stroke-width:2;fill:none;opacity:.85;animation:vib .9s ease-in-out infinite alternate}
    .vib2{animation-delay:.45s;opacity:.4}
    @keyframes vib{from{d:path("M60 168 Q480 150 900 168")}to{d:path("M60 168 Q480 186 900 168")}}
    .hui{fill:#f2e9d6;stroke:#b8a888;stroke-width:1;animation:glow 4.55s ease-in-out infinite}
    @keyframes glow{0%,100%{fill:#f2e9d6}6%{fill:#b5402f}14%{fill:#f2e9d6}}
    @media (prefers-reduced-motion: reduce){.vib,.hui{animation:none}}
  </style>
  <rect class="bg" width="960" height="300" rx="18"/>
  <text class="t cap" x="36" y="40">十三徽 · 纯律音高 · 13 HUI MARKERS · JUST INTONATION</text>
  <text class="t s" x="36" y="62">徽位按振动弦长比定位，泛音与按音的音高都由比例算出，而不是十二平均律的近似。</text>
  <text class="t s" x="36" y="80">Hui positions are exact string-length ratios; harmonics and stopped pitches are computed from them, not approximated in 12-TET.</text>
  <rect class="board" x="40" y="150" width="880" height="36" rx="18"/>
  <path class="str" d="M60 168 H900"/>
  <path class="vib" d="M60 168 Q480 150 900 168"/>
  <path class="vib vib2" d="M60 168 Q480 186 900 168"/>
  <text class="t s" x="60" y="140">龙龈 · nut</text>
  <text class="t s" x="900" y="140" text-anchor="end">岳山 · bridge</text>
    <circle class="hui" cx="795.0" cy="168" r="5" style="animation-delay:0.0s"/>
    <text class="t lab" x="795.0" y="200" text-anchor="middle">一</text>
    <text class="t frac" x="795.0" y="218" text-anchor="middle">1/8</text>
    <circle class="hui" cx="760.0" cy="168" r="5" style="animation-delay:0.35s"/>
    <text class="t lab" x="760.0" y="200" text-anchor="middle">二</text>
    <text class="t frac" x="760.0" y="218" text-anchor="middle">1/6</text>
    <circle class="hui" cx="732.0" cy="168" r="5" style="animation-delay:0.7s"/>
    <text class="t lab" x="732.0" y="200" text-anchor="middle">三</text>
    <text class="t frac" x="732.0" y="218" text-anchor="middle">1/5</text>
    <circle class="hui" cx="690.0" cy="168" r="5" style="animation-delay:1.05s"/>
    <text class="t lab" x="690.0" y="200" text-anchor="middle">四</text>
    <text class="t frac" x="690.0" y="218" text-anchor="middle">1/4</text>
    <circle class="hui" cx="620.0" cy="168" r="5" style="animation-delay:1.4s"/>
    <text class="t lab" x="620.0" y="200" text-anchor="middle">五</text>
    <text class="t frac" x="620.0" y="218" text-anchor="middle">1/3</text>
    <circle class="hui" cx="564.0" cy="168" r="5" style="animation-delay:1.75s"/>
    <text class="t lab" x="564.0" y="200" text-anchor="middle">六</text>
    <text class="t frac" x="564.0" y="218" text-anchor="middle">2/5</text>
    <circle class="hui" cx="480.0" cy="168" r="7" style="animation-delay:2.1s"/>
    <text class="t lab" x="480.0" y="200" text-anchor="middle">七</text>
    <text class="t frac" x="480.0" y="218" text-anchor="middle">1/2</text>
    <circle class="hui" cx="396.0" cy="168" r="5" style="animation-delay:2.45s"/>
    <text class="t lab" x="396.0" y="200" text-anchor="middle">八</text>
    <text class="t frac" x="396.0" y="218" text-anchor="middle">3/5</text>
    <circle class="hui" cx="340.0" cy="168" r="5" style="animation-delay:2.8s"/>
    <text class="t lab" x="340.0" y="200" text-anchor="middle">九</text>
    <text class="t frac" x="340.0" y="218" text-anchor="middle">2/3</text>
    <circle class="hui" cx="270.0" cy="168" r="5" style="animation-delay:3.15s"/>
    <text class="t lab" x="270.0" y="200" text-anchor="middle">十</text>
    <text class="t frac" x="270.0" y="218" text-anchor="middle">3/4</text>
    <circle class="hui" cx="228.0" cy="168" r="5" style="animation-delay:3.5s"/>
    <text class="t lab" x="228.0" y="200" text-anchor="middle">十一</text>
    <text class="t frac" x="228.0" y="218" text-anchor="middle">4/5</text>
    <circle class="hui" cx="200.0" cy="168" r="5" style="animation-delay:3.85s"/>
    <text class="t lab" x="200.0" y="200" text-anchor="middle">十二</text>
    <text class="t frac" x="200.0" y="218" text-anchor="middle">5/6</text>
    <circle class="hui" cx="165.0" cy="168" r="5" style="animation-delay:4.2s"/>
    <text class="t lab" x="165.0" y="200" text-anchor="middle">十三</text>
    <text class="t frac" x="165.0" y="218" text-anchor="middle">7/8</text>
  <text class="t s" x="36" y="262">七徽 = 1/2 弦长，泛音高八度；五徽 = 1/3，九徽 = 2/3，泛音高八度加纯五度。</text>
  <text class="t s" x="36" y="280">7th hui halves the string (octave harmonic); 5th and 9th hui sit at 1/3 and 2/3 (octave + fifth).</text>
</svg>
