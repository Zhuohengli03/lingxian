<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Lingxian architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f6f1e7}
    .t{font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#2b2118}
    .h{font-size:15px;font-weight:600}
    .s{font-size:11.5px;fill:#6b5d4f}
    .cap{font-size:11px;letter-spacing:.12em;fill:#9a8b7a;font-weight:600}
    .box{fill:#fffdf8;stroke:#d9cdb8;stroke-width:1.2}
    .core{fill:#2b2118}
    .chip{fill:#3a2e23;stroke:#5a4a3a}
    .chipT{font-size:12.5px;fill:#f6f1e7;font-weight:600}
    .chipS{font-size:10.5px;fill:#bfae98}
    .red{fill:#b5402f}
    .wire{stroke:#c9bba5;stroke-width:1.4;fill:none}
    .flow{stroke:#b5402f;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:10 150;animation:dash 2.6s linear infinite}
    .flow.d2{animation-delay:.65s}.flow.d3{animation-delay:1.3s}.flow.d4{animation-delay:1.95s}
    .flow.up{animation-direction:reverse}
    @keyframes dash{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
    .pulse{animation:pulse 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .pulse.p2{animation-delay:.4s}.pulse.p3{animation-delay:.8s}.pulse.p4{animation-delay:1.2s}.pulse.p5{animation-delay:1.6s}
    @keyframes pulse{0%,100%{opacity:.78}50%{opacity:1}}
    .dot{fill:#b5402f;animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.flow,.pulse,.dot{animation:none}}
  </style>
  <rect class="bg" width="960" height="560" rx="18"/>

  <!-- clients -->
  <text class="t cap" x="40" y="44">CLIENT · 浏览器端</text>
  <g>
    <rect class="box" x="40"  y="58" width="200" height="64" rx="10"/>
    <text class="t h" x="58" y="86">编辑器 Editor</text><text class="t s" x="58" y="106">减字谱 · 五线谱 · 简谱 · 竖版</text>
    <rect class="box" x="260" y="58" width="200" height="64" rx="10"/>
    <text class="t h" x="278" y="86">课堂与协作 Classroom</text><text class="t s" x="278" y="106">实时协作 · 批注 · 版本对比</text>
    <rect class="box" x="480" y="58" width="200" height="64" rx="10"/>
    <text class="t h" x="498" y="86">调音器 Tuner</text><text class="t s" x="498" y="106">YIN · Viterbi · AudioWorklet</text>
    <rect class="box" x="700" y="58" width="220" height="64" rx="10"/>
    <text class="t h" x="718" y="86">官网与后台 Site / Manager</text><text class="t s" x="718" y="106">中英双语 · 指法大全 · 运营看板</text>
  </g>

  <!-- wires clients -> core -->
  <path class="wire" d="M140 122 V160"/><path class="wire" d="M360 122 V160"/><path class="wire" d="M580 122 V160"/><path class="wire" d="M810 122 V160"/>
  <path class="flow"    d="M140 122 V160"/><path class="flow d2" d="M360 122 V160"/><path class="flow d3" d="M580 122 V160"/><path class="flow d4" d="M810 122 V160"/>

  <!-- core engine -->
  <rect class="core" x="40" y="160" width="880" height="150" rx="14"/>
  <text class="t" x="64" y="192" style="font-size:16px;font-weight:700;fill:#f6f1e7">七弦引擎 Qixian Core Engine</text>
  <text class="t" x="64" y="212" style="font-size:11.5px;fill:#bfae98">packages/shared · 不可变数据模型 · 数据驱动记谱（JSON 技法库）· 16,384 ticks / 四分音符</text>
  <circle class="dot" cx="890" cy="188" r="4.5"/>
  <g>
    <rect class="chip pulse"    x="64"  y="228" width="152" height="62" rx="9"/><text class="t chipT" x="80"  y="253">Schema</text><text class="t chipS" x="80"  y="273">Token · Section · Doc</text>
    <rect class="chip pulse p2" x="230" y="228" width="152" height="62" rx="9"/><text class="t chipT" x="246" y="253">Pitch 音高</text><text class="t chipS" x="246" y="273">十三徽纯律 · 11 种定弦</text>
    <rect class="chip pulse p3" x="396" y="228" width="152" height="62" rx="9"/><text class="t chipT" x="412" y="253">Time 时值</text><text class="t chipS" x="412" y="273">小节 · 连音 · 附点</text>
    <rect class="chip pulse p4" x="562" y="228" width="152" height="62" rx="9"/><text class="t chipT" x="578" y="253">Diff 版本</text><text class="t chipS" x="578" y="273">版本对比 · 草稿恢复</text>
    <rect class="chip pulse p5" x="728" y="228" width="168" height="62" rx="9"/><text class="t chipT" x="744" y="253">ML 转译</text><text class="t chipS" x="744" y="273">简谱 → 减字 · 排序模型</text>
  </g>

  <!-- wires core -> api -->
  <path class="wire" d="M480 310 V352"/><path class="flow" d="M480 310 V352"/><path class="flow up d3" d="M500 310 V352" style="stroke:#3f7d5a"/>

  <!-- api row -->
  <text class="t cap" x="40" y="346">SERVER · 服务端</text>
  <rect class="box" x="40" y="352" width="560" height="70" rx="10"/>
  <text class="t h" x="58" y="380">Next.js 14 App Router · API Routes</text>
  <text class="t s" x="58" y="401">/api/app · /api/manager · /api/auth · 琴灵问答（RAG）· Auth.js · Stripe · PostHog</text>
  <rect class="box" x="620" y="352" width="140" height="70" rx="10"/>
  <text class="t h" x="636" y="380">协作 WS</text><text class="t s" x="636" y="401">Y.Doc 实时同步</text>
  <rect class="box" x="780" y="352" width="140" height="70" rx="10"/>
  <text class="t h" x="796" y="380">琴讯 Worker</text><text class="t s" x="796" y="401">资讯收集 · 摘要</text>
  <circle class="dot" cx="742" cy="370" r="3.5"/><circle class="dot" cx="902" cy="370" r="3.5" style="animation-delay:.8s"/>

  <!-- wires api -> db -->
  <path class="wire" d="M320 422 V462"/><path class="wire" d="M690 422 V462"/><path class="wire" d="M850 422 V462"/>
  <path class="flow" d="M320 422 V462"/><path class="flow d2" d="M690 422 V462"/><path class="flow d3" d="M850 422 V462"/>

  <!-- data -->
  <rect x="40" y="462" width="880" height="62" rx="10" fill="#ede5d6" stroke="#d9cdb8"/>
  <text class="t h" x="58" y="490">PostgreSQL · Prisma 5</text>
  <text class="t s" x="58" y="510">曲谱与版本 · 自动保存 · 课堂 · 订阅 · 资讯 · 转译模型存库</text>
  <text class="t s" x="640" y="500" style="fill:#9a8b7a">Docker · GHCR · Nginx</text>
  <rect class="red" x="900" y="470" width="10" height="10"/>
</svg>
